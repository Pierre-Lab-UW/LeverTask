parameters:
  PulseDuration:
    actual: 0.1
    default: 0.1
    description: Pulse length in seconds for pulse mode (and fallback)
    type: float
  RelayOutputPin:
    actual: 0
    default: 0
    description: ADU200 relay pin used to drive the stimulus output
    type: int
  RelayOutputType:
    actual: Relay
    default: Relay
    description: Logical name/type for the output (for documentation)
    type: str
  SwitchType:
    actual: step
    default: step
    description: Relay switching mode ( step | pulse | toggle)
    options:
    - step
    - pulse
    - toggle
    subtype: str
    type: dropdown
  TaskName:
    actual: SingleStimuliResponse
    default: SingleStimuliResponse
    type: str
  Timeout:
    actual: 40
    default: 40
    description: Time (s) before session times out
    type: int
  runnable:
    actual: false
    default: false
    hidden: true
    type: bool
